<!doctype html>
<html><head><meta charset="utf-8"><title>Primavera 2027 price</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff}
  .poster{position:relative;width:2061px;height:2576px;background:url(price-clean.png) 0 0/2061px 2576px no-repeat;
    font-family:'Inter',sans-serif;font-weight:700;color:#0b0b0b;text-transform:uppercase}
  /* price table: one left edge, one right edge, equal rows */
  .table{position:absolute;left:170px;right:170px;top:1880px}
  .row{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #0b0b0b}
  .head{padding-bottom:30px;font-size:46px;letter-spacing:.05em}
  .tier{padding:38px 0 40px}
  .tier .name{font-size:58px;font-weight:800;letter-spacing:.01em;line-height:1}
  .tier .what{font-size:34px;font-weight:600;letter-spacing:.05em;margin-top:16px}
  .tier .price{font-size:78px;font-weight:800;letter-spacing:-.01em;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
  .tier .price small{font-size:34px;font-weight:700;letter-spacing:.04em;margin-left:6px}
  .note{margin-top:30px;font-size:30px;letter-spacing:.06em}
</style></head><body>
<div class="poster" id="poster">
  <div class="table">
    <div class="row head"><span>6 Days / 5 Nights</span><span>2–7 June 2027</span></div>
    <div class="row tier">
      <div><p class="name">The Fòrum Edit</p><p class="what">Regular pass · 3-star hotel</p></div>
      <p class="price">Rp 47,500,000<small>/pax</small></p>
    </div>
    <div class="row tier">
      <div><p class="name">VIP</p><p class="what">VIP pass · 4-star hotel</p></div>
      <p class="price">Rp 59,500,000<small>/pax</small></p>
    </div>
    <p class="note">*Flights not included</p>
  </div>
</div>
</body></html>
